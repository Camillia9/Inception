; ============================================
; CONFIGURATION PHP-FPM
; ============================================

[www]
; Nom du pool (groupe de processus)
user = www-data
group = www-data

; ============================================
; ÉCOUTE RÉSEAU
; ============================================
; PHP-FPM écoute sur le port 9000
; 0.0.0.0 = toutes les interfaces (pour que NGINX puisse se connecter)
listen = 0.0.0.0:9000

; Permissions du socket (pas utilisé ici car on utilise TCP)
listen.owner = www-data
listen.group = www-data

; ============================================
; GESTION DES PROCESSUS
; ============================================
; pm = process manager (gestionnaire de processus)

; Mode dynamique : crée des processus selon la charge
pm = dynamic

; Nombre maximum de processus enfants
pm.max_children = 5

; Nombre de processus au démarrage
pm.start_servers = 2

; Minimum de processus inactifs
pm.min_spare_servers = 1

; Maximum de processus inactifs
pm.max_spare_servers = 3

; ============================================
; JOURNALISATION
; ============================================
; Afficher les erreurs dans les logs
catch_workers_output = yes

; Fichier de log des erreurs PHP
php_admin_value[error_log] = /var/log/php-fpm.log
php_admin_flag[log_errors] = on